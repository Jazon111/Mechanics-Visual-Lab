         &lt;label id=&quot;magLabel&quot; class=&quot;text-xs font-bold text-slate-400 block mb-1&quot;&gt;数值 (kN)&lt;/label&gt; &lt;input type=&quot;number&quot; id=&quot;magnitude&quot; value=&quot;2&quot; class=&quot;w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-blue-400 transition-all&quot;&gt;
        &lt;/div&gt;
        &lt;div&gt;
         &lt;label class=&quot;text-xs font-bold text-slate-400 block mb-1&quot;&gt;位置 x (m)&lt;/label&gt; &lt;input type=&quot;number&quot; id=&quot;position&quot; value=&quot;5&quot; step=&quot;0.1&quot; class=&quot;w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-blue-400 transition-all&quot;&gt;
        &lt;/div&gt;
        &lt;div id=&quot;lenInputBox&quot; class=&quot;col-span-2 hidden&quot;&gt;
         &lt;label class=&quot;text-xs font-bold text-slate-400 block mb-1&quot;&gt;作用长度 (m)&lt;/label&gt; &lt;input type=&quot;number&quot; id=&quot;loadLen&quot; value=&quot;2&quot; step=&quot;0.1&quot; class=&quot;w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-blue-400 transition-all&quot;&gt;
        &lt;/div&gt;
       &lt;/div&gt;
       &lt;button id=&quot;addBtn&quot; class=&quot;w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all shadow-lg shadow-blue-100 flex items-center justify-center gap-2&quot;&gt;&lt;i data-lucide=&quot;arrow-down-to-line&quot; class=&quot;w-5 h-5&quot;&gt;&lt;/i&gt; 添加至梁&lt;/button&gt;
      &lt;/div&gt;
     &lt;/div&gt;
     &lt;!-- Load List --&gt;
     &lt;div class=&quot;chart-card&quot;&gt;
      &lt;h3 class=&quot;text-xs font-bold text-slate-400 uppercase mb-4&quot;&gt;荷载清单&lt;/h3&gt;
      &lt;div id=&quot;loadList&quot; class=&quot;space-y-2 max-h-64 overflow-y-auto pr-2 custom-scroll&quot;&gt;&lt;/div&gt;
     &lt;/div&gt;
    &lt;/div&gt;
    &lt;!-- Right: Diagrams --&gt;
    &lt;div class=&quot;lg:col-span-8 space-y-6&quot;&gt;
     &lt;!-- SFD --&gt;
     &lt;div class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;flex justify-between items-center mb-4&quot;&gt;
       &lt;h3 class=&quot;font-bold text-slate-800 flex items-center gap-2&quot;&gt;&lt;span class=&quot;w-3 h-3 bg-blue-500 rounded-full&quot;&gt;&lt;/span&gt; 剪力图 V(x) &lt;span class=&quot;text-slate-400 font-normal text-sm&quot;&gt;(kN)&lt;/span&gt;&lt;/h3&gt;
       &lt;div id=&quot;vMax&quot; class=&quot;text-[10px] font-mono font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h-[240px]&quot;&gt;
       &lt;canvas id=&quot;vChart&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
     &lt;/div&gt;
     &lt;!-- BMD --&gt;
     &lt;div class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;flex justify-between items-center mb-4&quot;&gt;
       &lt;h3 class=&quot;font-bold text-slate-800 flex items-center gap-2&quot;&gt;&lt;span class=&quot;w-3 h-3 bg-red-500 rounded-full&quot;&gt;&lt;/span&gt; 弯矩图 M(x) &lt;span class=&quot;text-slate-400 font-normal text-sm&quot;&gt;(kN&middot;m)&lt;/span&gt;&lt;/h3&gt;
       &lt;div id=&quot;mMax&quot; class=&quot;text-[10px] font-mono font-bold bg-red-50 text-red-600 px-2 py-1 rounded&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h-[240px]&quot;&gt;
       &lt;canvas id=&quot;mChart&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
     &lt;/div&gt;

   &lt;/div&gt;

  &lt;script&gt;
        lucide.createIcons();

        let L = 10;
        let currentType = 'point';
        let loads = [];
        let charts = {};

        const el = (id) =&gt; document.getElementById(id);

        // --- Type Switcher ---
        window.setType = (type) =&gt; {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn =&gt; {
                btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                btn.classList.add('border-transparent', 'bg-slate-50', 'text-slate-500');
            });
            const activeBtn = el(`btn-${type}`);
            activeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
            activeBtn.classList.remove('border-transparent', 'bg-slate-50', 'text-slate-500');

            el('magLabel').innerText = type === 'udl' ? '数值 (kN/m)' : type === 'moment' ? '数值 (kN&middot;m)' : '数值 (kN)';
            el('lenInputBox').style.display = type === 'udl' ? 'block' : 'none';
        };

        // --- Calculation Engine ---
        function solve() {
            let sumP = 0;
            let sumMA = 0;

            loads.forEach(ld =&gt; {
                if (ld.type === 'point') {
                    sumP += ld.mag;
                    sumMA += ld.mag * ld.pos;
                } else if (ld.type === 'moment') {
                    sumMA += ld.mag; // Clockwise positive
                } else if (ld.type === 'udl') {
                    let total = ld.mag * ld.len;
                    sumP += total;
                    sumMA += total * (ld.pos + ld.len / 2);
                }
            });

            const Rb = sumMA / L;
            const Ra = sumP - Rb;

            const points = 301; // Higher resolution for free span
            const step = L / (points - 1);
            let dataV = [], dataM = [];

            for (let i = 0; i &lt; points; i++) {
                let x = i * step;
                let V = Ra;
                let M = Ra * x;

                loads.forEach(ld =&gt; {
                    if (x &gt; ld.pos) {
                        if (ld.type === 'point') {
                            V -= ld.mag;
                            M -= ld.mag * (x - ld.pos);
                        } else if (ld.type === 'moment') {
                            M += ld.mag; // Superposition: Clockwise moment on left increases internal moment
                        } else if (ld.type === 'udl') {
                            let activeLen = Math.min(x - ld.pos, ld.len);
                            let force = ld.mag * activeLen;
                            V -= force;
                            M -= force * (activeLen / 2 + Math.max(0, x - (ld.pos + ld.len)));
                        }
                    }
                });
                dataV.push({x, y: V});
                dataM.push({x, y: M});
            }
            return { dataV, dataM, Ra, Rb };
        }

        // --- UI &amp; Charts ---
        function initCharts() {
            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'bottom', grid: { color: '#f1f5f9' }, title: { display: true, text: '位置 x (m)', font: { size: 10, weight: 'bold' } } },
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }
                },
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        titleFont: { size: 12, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            label: (ctx) =&gt; `数值: ${ctx.parsed.y.toFixed(3)}`
                        }
                    }
                }
            };

            charts.v = new Chart(el('vChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.08)', fill: true, data: [], tension: 0, pointRadius: 0, borderWidth: 2 }] },
                options: commonOptions
            });

            charts.m = new Chart(el('mChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.08)', fill: true, data: [], tension: 0, pointRadius: 0, borderWidth: 2 }] },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, reverse: true } // Positive moment down
                    }
                }
            });
        }

        function update() {
            el('spanDisplay').innerText = `L = ${L.toFixed(2)}m`;
            const { dataV, dataM } = solve();
            
            charts.v.data.datasets[0].data = dataV;
            charts.m.data.datasets[0].data = dataM;
            
            // Update X-axis range
            charts.v.options.scales.x.max = L;
            charts.m.options.scales.x.max = L;
            
            charts.v.update();
            charts.m.update();

            const maxV = Math.max(...dataV.map(d =&gt; Math.abs(d.y)));
            const maxM = Math.max(...dataM.map(d =&gt; Math.abs(d.y)));
            el('vMax').innerText = `|V|max: ${maxV.toFixed(3)} kN`;
            el('mMax').innerText = `|M|max: ${maxM.toFixed(3)} kN&middot;m`;
            
            renderLoads();
        }

        function renderLoads() {
            const list = el('loadList');
            list.innerHTML = loads.length ? '' : '&lt;div class=&quot;text-center py-8 text-slate-300 italic text-sm&quot;&gt;等待添加荷载...&lt;/div&gt;';
            
            const viz = el('loadMarkers');
            viz.innerHTML = '';
            const vizWidth = el('beamViz').offsetWidth - 100; // 50px padding each side

            loads.forEach((ld, i) =&gt; {
                // List item
                const item = document.createElement('div');
                const isOut = ld.pos &gt; L || (ld.type === 'udl' &amp;&amp; ld.pos + ld.len &gt; L);
                item.className = `flex items-center justify-between p-3 rounded-xl border transition-all ${isOut ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-100'}`;
                item.innerHTML = `
                    &lt;div class=&quot;flex flex-col&quot;&gt;
                        &lt;span class=&quot;text-[9px] font-black ${isOut ? 'text-red-500' : 'text-slate-400'} uppercase tracking-tighter&quot;&gt;${ld.type === 'point' ? '集中力' : ld.type === 'moment' ? '力偶' : '均布荷载'}&lt;/span&gt;
                        &lt;span class=&quot;text-xs font-bold ${isOut ? 'text-red-700' : 'text-slate-700'}&quot;&gt;${ld.mag}${ld.type === 'udl' ? 'kN/m' : ld.type === 'moment' ? 'kNm' : 'kN'} @ ${ld.pos}m&lt;/span&gt;
                        ${isOut ? '&lt;span class=&quot;text-[8px] text-red-500 font-bold&quot;&gt;超出跨径范围!&lt;/span&gt;' : ''}
                    &lt;/div&gt;
                    &lt;button onclick=&quot;removeLoad(${i})&quot; class=&quot;p-2 text-slate-300 hover:text-red-500 transition-colors&quot;&gt;&lt;i data-lucide=&quot;x&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;&lt;/button&gt;
                `;
                list.appendChild(item);

                // Viz marker (only if within range)
                if (ld.pos &lt;= L) {
                    const marker = document.createElement('div');
                    marker.className = 'absolute';
                    const left = 50 + (ld.pos / L) * vizWidth;
                    marker.style.left = `${left}px`;
                    
                    if (ld.type === 'point') {
                        marker.style.top = '30px';
                        marker.innerHTML = `&lt;div class=&quot;w-0.5 h-[50px] bg-blue-500 relative&quot;&gt;&lt;div class=&quot;absolute bottom-0 -left-1 w-0 h-0 border-l-4 border-r-4 border-t-8 border-t-blue-500 border-l-transparent border-r-transparent&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
                    } else if (ld.type === 'moment') {
                        marker.style.top = '64px';
                        marker.style.transform = 'translateX(-16px)';
                        marker.innerHTML = `&lt;div class=&quot;w-8 h-8 border-2 border-red-500 rounded-full border-t-transparent flex items-center justify-center bg-white/80&quot;&gt;&lt;i data-lucide=&quot;rotate-cw&quot; class=&quot;w-4 h-4 text-red-500&quot;&gt;&lt;/i&gt;&lt;/div&gt;`;
                    } else if (ld.type === 'udl') {
                        const width = Math.min((ld.len / L) * vizWidth, vizWidth - (ld.pos / L) * vizWidth);
                        marker.style.top = '50px';
                        marker.style.width = `${width}px`;
                        marker.className += ' bg-emerald-500/20 border-t-2 border-emerald-500 h-[30px] flex justify-around items-end pb-1';
                        marker.innerHTML = Array(Math.min(10, Math.ceil(ld.len))).fill('&lt;div class=&quot;w-px h-4 bg-emerald-500&quot;&gt;&lt;/div&gt;').join('');
                    }
                    viz.appendChild(marker);
                }
            });
            lucide.createIcons();
        }

        // --- Events ---
        el('addBtn').onclick = () =&gt; {
            const mag = parseFloat(el('magnitude').value);
            const pos = parseFloat(el('position').value);
            const len = parseFloat(el('loadLen').value);
            if (isNaN(mag) || isNaN(pos)) return;
            loads.push({ type: currentType, mag, pos, len: currentType === 'udl' ? len : 0 });
            update();
        };

        el('beamLength').oninput = (e) =&gt; { 
            const val = parseFloat(e.target.value);
            if (val &gt; 0) {
                L = val; 
                update(); 
            }
        };

        el('clearAll').onclick = () =&gt; {
            if (confirm('确定要清空所有荷载吗？')) {
                loads = [];
                update();
            }
        };

        window.removeLoad = (i) =&gt; { loads.splice(i, 1); update(); };

        // Initial Setup
        initCharts();
        update();
        
        // Handle window resize for viz
        window.onresize = renderLoads;
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击飞象老师 Logo 的埋点
     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
