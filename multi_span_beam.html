// ==================== 绘图 ====================
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W=0, H=0, SCALE=60, ox=0, oy=0;
let showM=true, showV=false, showN=false, showFrame=true, showCheck=false;

function getBounds(){
  let minX=Infinity,maxX=-Infinity;
  NODE_IDS.forEach(id => { minX=Math.min(minX,NODES[id].x); maxX=Math.max(maxX,NODES[id].x); });
  return {minX,maxX,w:maxX-minX};
}
function resize(){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W = rect.width; H = rect.height;
  const b = getBounds();
  const padL = 60, padR = 60, padT = 90, padB = 80;
  const fw = Math.max(b.w, 1);
  SCALE = Math.max(15, Math.min((W-padL-padR)/fw, 90));
  const cx = (b.minX + b.maxX) / 2;
  ox = padL + (W-padL-padR)/2 - cx*SCALE;
  oy = padT + (H-padT-padB)*0.35;
  render();
}
window.addEventListener('resize', resize);
function toS(x,y){ return {x:ox + x*SCALE, y:oy - y*SCALE}; }
function updateStatus(msg, isErr){
  const s = document.getElementById('status');
  s.innerHTML = isErr ? `<span style="color:#f85149;font-weight:600;">${msg}</span>` : msg;
}

// ==================== 绘图辅助函数 ====================
// 画圆角矩形路径（不自动 fill/stroke，由调用方控制）
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function drawStructure(){
  if(!showFrame) return;
  const beamY = 0;
  // 梁高度为原来的1/4：原总高 32px (±16) → 新总高 8px (±4)
  const beamHalfH = 4;
  MEMBERS.forEach(mem => {
    const na = NODES[mem.nodeA], nb = NODES[mem.nodeB];
    const sa = toS(na.x, beamY), sb = toS(nb.x, beamY);
    // 梁体（总高 8px）
    ctx.save();
    const grd = ctx.createLinearGradient(0, sa.y-beamHalfH, 0, sa.y+beamHalfH);
    grd.addColorStop(0, '#2d333b'); grd.addColorStop(0.5, '#444c56'); grd.addColorStop(1, '#2d333b');
    ctx.fillStyle = grd;
    ctx.fillRect(sa.x, sa.y - beamHalfH, sb.x - sa.x, beamHalfH * 2);
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1;
    ctx.strokeRect(sa.x, sa.y - beamHalfH, sb.x - sa.x, beamHalfH * 2);
    // 中轴线（细线虚线，标示集中力偶的作用轴线）
    ctx.strokeStyle = 'rgba(88,166,255,0.4)'; ctx.lineWidth = 0.8; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
  // 节点标签
  ctx.font = 'bold 12px "Segoe UI"'; ctx.fillStyle = '#e6edf3'; ctx.textAlign = 'center';
  NODE_IDS.forEach(id => {
    const s = toS(NODES[id].x, 0);
    ctx.fillText(id, s.x, s.y - 12);
    // 节点小圆点
    if(hingeNodes[id]) {
      ctx.save();
      ctx.strokeStyle = '#a371f7'; ctx.fillStyle = '#a371f7'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI*2); ctx.stroke();
      ctx.font = 'bold 9px "Segoe UI"'; ctx.fillStyle = '#a371f7';
      ctx.fillText('铰', s.x, s.y+16);
      ctx.restore();
    } else {
      // 普通节点极小圆点
      ctx.save();
      ctx.fillStyle = '#58a6ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
}

function drawSupport(x, type){
  const s = toS(x, 0);
  const by = s.y;
  ctx.save();
  ctx.strokeStyle = '#8b949e'; ctx.lineWidth = 1.5;
  ctx.fillStyle = '#21262d';
  if(type==='fixed'){
    // 固定支座: 墙 + 阴影线
    ctx.beginPath();
    ctx.moveTo(s.x, by-22); ctx.lineTo(s.x+18, by-22);
    ctx.lineTo(s.x+18, by+22); ctx.lineTo(s.x, by+22); ctx.closePath(); ctx.fill(); ctx.stroke();
    for(let wy=-20; wy<=20; wy+=4){
      ctx.beginPath(); ctx.moveTo(s.x+18, by+wy); ctx.lineTo(s.x+23, by+wy-3); ctx.stroke();
    }
  } else if(type==='pinned'){
    ctx.beginPath();
    ctx.moveTo(s.x, by+9); ctx.lineTo(s.x-10, by+25); ctx.lineTo(s.x+10, by+25); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x-14, by+25); ctx.lineTo(s.x+14, by+25); ctx.stroke();
    for(let i=-10;i<=10;i+=4){ ctx.beginPath(); ctx.moveTo(s.x+i, by+25); ctx.lineTo(s.x+i-3, by+30); ctx.stroke(); }
  } else if(type==='roller'){
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(s.x, by+9); ctx.lineTo(s.x, by+23); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x, by+9, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, by+23, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x-14, by+28); ctx.lineTo(s.x+14, by+28); ctx.stroke();
    for(let i=-10;i<=10;i+=4){ ctx.beginPath(); ctx.moveTo(s.x+i, by+28); ctx.lineTo(s.x+i-3, by+33); ctx.stroke(); }
  } else if(type==='slider'){
    ctx.lineWidth = 2;
    const barLen = 18, gap = 7;
    ctx.beginPath(); ctx.moveTo(s.x, by-gap); ctx.lineTo(s.x+barLen, by-gap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x, by+gap); ctx.lineTo(s.x+barLen, by+gap); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x, by-gap, 2.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, by+gap, 2.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x+barLen, by-22); ctx.lineTo(s.x+barLen, by+22); ctx.stroke();
    for(let wy=-20; wy<=20; wy+=4){
      ctx.beginPath(); ctx.moveTo(s.x+barLen, by+wy); ctx.lineTo(s.x+barLen+5, by+wy-3); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawLoads(){
  // 统一梁半高（与drawStructure保持一致：总高8px → ±4px）
  const beamHalfH = 4;
  MEMBERS.forEach(mem => {
    const na = NODES[mem.nodeA], nb = NODES[mem.nodeB];
    const by = 0;
    loads.filter(l=>l.member===mem.id).forEach(ld => {
      if(ld.type==='point'){
        const t = ld.pos / mem.L;
        const gx = na.x + t*(nb.x-na.x);
        const s = toS(gx, by);
        const {Fx,Fy} = getGlobalForce(ld);
        ctx.save();
        ctx.strokeStyle = '#f85149'; ctx.fillStyle = '#f85149';
        ctx.shadowColor = '#f85149'; ctx.shadowBlur = 6;
        if(Fy !== 0) {
          // —— 竖向集中力：优化工程标准箭头（更锐利、比例更协调） ——
          const down = Fy < 0;
          const arrowLen = 44;          // 箭杆总长（略加长更醒目）
          const ah = 12, aw = 5;        // 箭头（高12，半宽5 → 更锐利的三角）
          const y_top = s.y - beamHalfH;  // 梁上边缘
          const y_bot = s.y + beamHalfH;  // 梁下边缘
          let y_tip, y_end;
          if(down) {
            y_tip = y_top;               // 向下：尖端精确碰到梁上沿
            y_end = y_tip - arrowLen;
          } else {
            y_tip = y_bot;               // 向上：尖端精确碰到梁下沿
            y_end = y_tip + arrowLen;
          }
          // 箭杆（中粗，起点稍大→末端更细的观感，用双线条模拟实心箭杆）
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(s.x, y_end); ctx.lineTo(s.x, y_tip + (down?+ah:-ah)); ctx.stroke();
          // 箭头三角（实心等腰三角形，更锐利：高/底=12/10≈2.4）
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          if(down) {
            ctx.moveTo(s.x,         y_tip);        // 顶点（尖端正对梁缘）
            ctx.lineTo(s.x - aw,    y_tip - ah);   // 左底角
            ctx.lineTo(s.x + aw,    y_tip - ah);   // 右底角
          } else {
            ctx.moveTo(s.x,         y_tip);        // 向上顶点
            ctx.lineTo(s.x - aw,    y_tip + ah);
            ctx.lineTo(s.x + aw,    y_tip + ah);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          // 作用点小圆（精确标示梁缘作用点位置）
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#f85149';
          ctx.beginPath(); ctx.arc(s.x, y_tip, 2.2, 0, Math.PI*2); ctx.fill();
          // 箭尾短横线（工程图标准，略加长）
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(s.x-aw-1, y_end); ctx.lineTo(s.x+aw+1, y_end); ctx.stroke();
          // 数值标签（带圆角底色框）
          const txt = `${ld.value} kN`;
          ctx.font = 'bold 11px "Consolas",monospace'; ctx.textAlign = 'center';
          const tw = ctx.measureText(txt).width;
          const ty = down ? y_end - 8 : y_end + 15;
          ctx.fillStyle = 'rgba(13,17,23,0.92)';
          // 圆角矩形
          roundRect(ctx, s.x - tw/2 - 6, ty - 10, tw+12, 15, 3);
          ctx.fill();
          ctx.fillStyle = '#f85149';
          ctx.fillText(txt, s.x, ty+2);
        } else if(Fx !== 0) {
          // —— 水平集中力：优化工程标准箭头 ——
          const right = Fx > 0;
          const arrowLen = 44;
          const ah = 12, aw = 5;
          const y_line = s.y - 28;        // 画在梁上方更远处，避开图线
          let x_tip, x_end;
          if(right) {
            x_tip = s.x + 14;             // 箭头尖端指向作用点（梁右侧）
            x_end = x_tip - arrowLen;
          } else {
            x_tip = s.x - 14;
            x_end = x_tip + arrowLen;
          }
          // 引线：从作用点向上画到箭杆线，再水平画箭头
          ctx.lineWidth = 1.4;
          ctx.setLineDash([3,2]);
          ctx.beginPath(); ctx.moveTo(s.x, s.y - beamHalfH); ctx.lineTo(s.x, y_line); ctx.stroke();
          ctx.setLineDash([]);
          // 箭杆
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x_end, y_line); ctx.lineTo(x_tip + (right?-ah:+ah), y_line); ctx.stroke();
          // 三角箭头（更锐利）
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          if(right) {
            ctx.moveTo(x_tip,      y_line);
            ctx.lineTo(x_tip-ah,   y_line-aw);
            ctx.lineTo(x_tip-ah,   y_line+aw);
          } else {
            ctx.moveTo(x_tip,      y_line);
            ctx.lineTo(x_tip+ah,   y_line-aw);
            ctx.lineTo(x_tip+ah,   y_line+aw);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          // 箭尾短竖线
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(x_end, y_line-aw-1); ctx.lineTo(x_end, y_line+aw+1); ctx.stroke();
          // 标签
          ctx.shadowBlur = 0;
          const txt = `${ld.value} kN`;
          ctx.font = 'bold 11px "Consolas",monospace'; ctx.textAlign = 'center';
          const tw = ctx.measureText(txt).width;
          ctx.fillStyle = 'rgba(13,17,23,0.92)';
          roundRect(ctx, (x_tip+x_end)/2 - tw/2 - 6, y_line - 26, tw+12, 15, 3);
          ctx.fill();
          ctx.fillStyle = '#f85149';
          ctx.fillText(txt, (x_tip+x_end)/2, y_line - 15);
        }
        ctx.restore();
      } else if(ld.type==='moment'){
        // —— 集中力偶：精确绘制在梁的中轴线处（圆心=作用点），用双圆弧标示 ——
        const t = ld.pos / mem.L;
        const gx = na.x + t*(nb.x-na.x);
        const s = toS(gx, by);
        ctx.save();
        ctx.strokeStyle = '#a371f7'; ctx.fillStyle = '#a371f7';
        ctx.shadowColor = '#a371f7'; ctx.shadowBlur = 6;
        const cx = s.x;                 // 精确作用点：梁的水平坐标
        const cy = s.y;                 // 精确作用点：梁中轴线（y=0）
        const r_out = 11;               // 外弧半径
        const r_in  = 7;                // 内弧半径（双弧更清晰）
        const ccw = getMomentSign(ld) > 0;
        ctx.lineWidth = 2;

        if(ccw) {
          // CCW（逆时针）：外弧 + 内弧 组成带形箭头，绕中轴线旋转
          // 弧范围：从右方(0°附近) 逆时针绕到左方，箭头指向左下方
          const angStart = Math.PI * 0.20;   // 36°（右下起点）
          const angEnd   = Math.PI * 1.80;   // 324°（左下终点，逆时针跨越约288°）
          // 外弧
          ctx.beginPath(); ctx.arc(cx, cy, r_out, angStart, angEnd, false); ctx.stroke();
          // 内弧（反向画以形成带）
          ctx.beginPath(); ctx.arc(cx, cy, r_in,  angEnd, angStart, true);  ctx.stroke();
          // 末端箭头三角形（逆时针切线方向）
          const angT = angEnd;
          const ax_o = cx + r_out*Math.cos(angT), ay_o = cy + r_out*Math.sin(angT);
          const ax_i = cx + r_in *Math.cos(angT), ay_i = cy + r_in *Math.sin(angT);
          const tx = angT + Math.PI/2;  // 前进方向（逆时针切线）：角度+90°
          const tipX = (ax_o+ax_i)/2 + 9*Math.cos(tx);
          const tipY = (ay_o+ay_i)/2 + 9*Math.sin(tx);
          ctx.beginPath();
          ctx.moveTo(ax_o, ay_o); ctx.lineTo(tipX, tipY); ctx.lineTo(ax_i, ay_i);
          ctx.closePath(); ctx.fill();
        } else {
          // CW（顺时针）：顺时针弧，箭头指向右下方
          const angStart = Math.PI * 0.80;   // 144°（左下起点）
          const angEnd   = Math.PI * (-0.20);// -36°（右下终点，顺时针跨越约288°）
          ctx.beginPath(); ctx.arc(cx, cy, r_out, angStart, angEnd, true);  ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy, r_in,  angEnd, angStart, false); ctx.stroke();
          // 末端箭头三角形（顺时针切线方向）
          const angT = angEnd;
          const ax_o = cx + r_out*Math.cos(angT), ay_o = cy + r_out*Math.sin(angT);
          const ax_i = cx + r_in *Math.cos(angT), ay_i = cy + r_in *Math.sin(angT);
          const tx = angT - Math.PI/2;  // 顺时针切线：角度-90°
          const tipX = (ax_o+ax_i)/2 + 9*Math.cos(tx);
          const tipY = (ay_o+ay_i)/2 + 9*Math.sin(tx);
          ctx.beginPath();
          ctx.moveTo(ax_o, ay_o); ctx.lineTo(tipX, tipY); ctx.lineTo(ax_i, ay_i);
          ctx.closePath(); ctx.fill();
        }

        // ★ 精确标示：中轴线上的作用点（实心圆点+十字，明确标示"集中力偶作用在梁中轴线"）
        ctx.shadowBlur = 0;
        // 外圆圈（突出显示中轴作用点）
        ctx.strokeStyle = '#a371f7'; ctx.fillStyle = 'rgba(163,113,247,0.25)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        // 中轴线十字（水平+竖直）
        ctx.strokeStyle = '#a371f7'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx-8, cy); ctx.lineTo(cx+8, cy); ctx.stroke();   // 水平（沿梁轴线）
        ctx.beginPath(); ctx.moveTo(cx, cy-7); ctx.lineTo(cx, cy+7); ctx.stroke();   // 竖直
        // 中心实心点
        ctx.fillStyle = '#a371f7';
        ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();

        // 数值标签（带圆角底色，置于上方避开图线）
        const dirLabel = ccw ? '↺' : '↻';
        const txt = `${dirLabel} ${ld.value} kN·m`;
        ctx.font = 'bold 11px "Consolas",monospace'; ctx.textAlign = 'center';
        const tw = ctx.measureText(txt).width;
        const ty = cy - r_out - 14;
        ctx.fillStyle = 'rgba(13,17,23,0.92)';
        roundRect(ctx, cx - tw/2 - 7, ty - 10, tw+14, 15, 3);
        ctx.fill();
        ctx.fillStyle = '#a371f7';
        ctx.fillText(txt, cx, ty+2);
        ctx.restore();
      } else if(ld.type==='udl'){
        // 均布荷载：箭头尖端精确碰到梁上缘（beamHalfH=4），并同步梁高
        const uHalfH = 4;
        const x1 = na.x + (ld.pos1/mem.L)*(nb.x-na.x);
        const x2 = na.x + (ld.pos2/mem.L)*(nb.x-na.x);
        const s1 = toS(x1, by), s2 = toS(x2, by);
        const y_beam_top = s1.y - uHalfH;       // 梁上边缘
        const arrow_head = 8;                   // 箭头三角形高度
        const shaft_len = 26;                   // 箭杆长度（不含箭头）
        const y_top_line = y_beam_top - shaft_len - arrow_head; // 顶部虚线位置
        ctx.save();
        ctx.strokeStyle = '#ffd700'; ctx.fillStyle = '#ffd700'; ctx.lineWidth = 1.8;
        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 3;
        // 顶部虚线（荷载布置范围线）
        ctx.setLineDash([4,3]); ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(s1.x, y_top_line); ctx.lineTo(s2.x, y_top_line); ctx.stroke();
        ctx.setLineDash([]);
        // 垂直箭头阵列（尖端正对梁上缘）
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.8;
        const n = Math.max(3, Math.floor(Math.abs(s2.x-s1.x)/28));
        for(let i=0;i<n;i++){
          const tt = (i+0.5)/n;
          const x = s1.x + (s2.x-s1.x)*tt;
          // 箭杆（从顶虚线到箭头尾）
          ctx.beginPath(); ctx.moveTo(x, y_top_line); ctx.lineTo(x, y_beam_top - arrow_head); ctx.stroke();
          // 箭头三角形（尖端精确到梁上缘 y_beam_top）
          ctx.beginPath();
          ctx.moveTo(x,              y_beam_top);
          ctx.lineTo(x - 4,          y_beam_top - arrow_head);
          ctx.lineTo(x + 4,          y_beam_top - arrow_head);
          ctx.closePath(); ctx.fill();
        }
        // 起止端小竖线（标示荷载精确范围）
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(s1.x, y_top_line-3); ctx.lineTo(s1.x, y_beam_top + 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s2.x, y_top_line-3); ctx.lineTo(s2.x, y_beam_top + 2); ctx.stroke();
        // 数值标签（带圆角底色框）
        ctx.shadowBlur = 0;
        const txt = `${ld.value} kN/m`;
        ctx.font = 'bold 10.5px "Consolas",monospace'; ctx.textAlign = 'center';
        const tw = ctx.measureText(txt).width;
        const cx = (s1.x+s2.x)/2;
        const ty = y_top_line - 14;
        ctx.fillStyle = 'rgba(13,17,23,0.92)';
        roundRect(ctx, cx - tw/2 - 6, ty - 10, tw+12, 15, 3);
        ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.fillText(txt, cx, ty+2);
        ctx.restore();
      }
    });
  });
  // 支座反力
  if(solution && showCheck) {
    NODE_IDS.forEach(id => {
      const type = SUPPORT_TYPES[id]; if(!type || type==='none') return;
      const r = solution.reactions[id];
      const s = toS(NODES[id].x, 0);
      ctx.save();
      if(Math.abs(r.fx) > 0.01) {
        const right = r.fx > 0;
        ctx.strokeStyle = '#3fb950'; ctx.fillStyle = '#3fb950'; ctx.lineWidth = 2.5;
        const from = s.x + (right?38:10), to = s.x + (right?10:38);
        ctx.beginPath(); ctx.moveTo(from, s.y+45); ctx.lineTo(to, s.y+45); ctx.stroke();
        const tipX = to + (right?8:-8);
        ctx.beginPath(); ctx.moveTo(to, s.y+40); ctx.lineTo(tipX, s.y+45); ctx.lineTo(to, s.y+50); ctx.closePath(); ctx.fill();
        ctx.font = 'bold 10px "Consolas",monospace'; ctx.textAlign = 'left';
        ctx.fillStyle = '#3fb950';
        ctx.fillText(`Fx=${Math.abs(r.fx).toFixed(2)}`, s.x+45, s.y+49);
      }
      if(Math.abs(r.fy) > 0.01) {
        const up = r.fy > 0;
        ctx.strokeStyle = '#58a6ff'; ctx.fillStyle = '#58a6ff'; ctx.lineWidth = 2.5;
        const from = s.y + (up?62:34), to = s.y + (up?38:60);
        ctx.beginPath(); ctx.moveTo(s.x, from); ctx.lineTo(s.x, to); ctx.stroke();
        const tipY = to + (up?8:-8);
        ctx.beginPath(); ctx.moveTo(s.x-5, to); ctx.lineTo(s.x, tipY); ctx.lineTo(s.x+5, to); ctx.closePath(); ctx.fill();
        ctx.font = 'bold 10px "Consolas",monospace'; ctx.textAlign = 'left';
        ctx.fillStyle = '#58a6ff';
        ctx.fillText(`Fy=${Math.abs(r.fy).toFixed(2)}`, s.x+8, up? s.y+66 : s.y+70);
      }
      if(Math.abs(r.m) > 0.01) {
        ctx.strokeStyle = '#f85149'; ctx.fillStyle = '#f85149'; ctx.lineWidth = 2;
        const cx=s.x, cy=s.y+85, r=14;
        const ccw = r.m > 0;
        if(ccw) {
          ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI*0.2, Math.PI*1.8, false); ctx.stroke();
          const ang = Math.PI*1.8;
          const ax=cx+r*Math.cos(ang), ay=cy+r*Math.sin(ang);
          ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+5,ay-3); ctx.lineTo(ax+2,ay+3); ctx.closePath(); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI*0.8, Math.PI*-0.2, true); ctx.stroke();
          const ang = Math.PI*-0.2;
          const ax=cx+r*Math.cos(ang), ay=cy+r*Math.sin(ang);
          ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-5,ay+3); ctx.lineTo(ax-2,ay-3); ctx.closePath(); ctx.fill();
        }
        ctx.font = 'bold 10px "Consolas",monospace'; ctx.textAlign = 'center';
        ctx.fillStyle = '#f85149';
        ctx.fillText(`M=${Math.abs(r.m).toFixed(2)}`, s.x, cy+26);
      }
      ctx.restore();
    });
  }
}

function drawDiagram(type, color) {
  if(!solved || !solution) return;
  const mf = solution.memberForces;
  let maxVal = 0;
  MEMBERS.forEach(mem => {
    const f = mf[mem.id]; if(f && f[type]) {
      const m = Math.max(...f[type].map(Math.abs)); if(m > maxVal) maxVal = m;
    }
  });
  if(maxVal < 0.001) return;
  const maxPx = Math.min(SCALE*0.7, 55);
  const scale = maxPx / maxVal;
  // 绘图标号方向（法向偏移符号）：
  //   sign > 0：正值沿法向 ny>0（屏幕y向下，即梁下方）；负值则向上
  //   sign < 0：正值沿法向反方向（屏幕y向上，即梁上方）；负值则向下
  //   - 弯矩图(sign=+1)：正M画在梁下方（下侧受拉），负M画在梁上方（上侧受拉）
  //   - 剪力图(sign=-1)：正V画在梁上方，负V画在梁下方
  //   - 轴力图(sign=-1)：拉力（正N）画在梁上方，压力画在下方
  const sign = (type === 'M') ? 1 : -1;
  MEMBERS.forEach(mem => {
    const f = mf[mem.id]; if(!f) return;
    const na = NODES[mem.nodeA], nb = NODES[mem.nodeB];
    const sa = toS(na.x, 0), sb = toS(nb.x, 0);
    const angle = Math.atan2(sb.y - sa.y, sb.x - sa.x);
    const nx = -Math.sin(angle), ny = Math.cos(angle);
    const data = f[type]; if(!data) return;
    const n = data.length;
    const xArr = f.x;  // ★ 实际局部坐标数组（距杆件起点的距离 a）
    const L_mem = f.L || mem.L;

    // ★ 预计算每个数据点对应的屏幕基准点（梁轴上的点）+ 偏移后的图线点
    //   使用实际 x 坐标 xArr[i]/L_mem 作为 t，而非均匀索引 i/(n-1)
    //   这样力偶左右两侧（x 仅差 1e-6）在屏幕上几乎重合，lineTo 会画出竖直突变线
    const basePts = new Array(n);  // 梁轴上的基准点
    const linePts = new Array(n);   // 偏移后的图线点
    for(let i=0;i<n;i++){
      const t = xArr[i] / L_mem;                  // 用实际 x 计算
      const bx = sa.x + (sb.x-sa.x)*t;
      const by = sa.y + (sb.y-sa.y)*t;
      const v  = data[i]*scale*sign;
      basePts[i] = {x: bx, y: by};
      linePts[i] = {x: bx + nx*v, y: by + ny*v};
    }
    // ★ 突变对识别：相邻两点 x 极近但值差异大（集中力偶左右截面）
    //   把它们的基准点强制对齐到同一 x，使图线在该处呈现真正的竖直线
    for(let i=1;i<n;i++){
      if(Math.abs(xArr[i] - xArr[i-1]) < 1e-4 && Math.abs(data[i] - data[i-1]) > 0.3){
        const xShared = (basePts[i].x + basePts[i-1].x) / 2;
        basePts[i].x = xShared; basePts[i-1].x = xShared;
        linePts[i].x = xShared + (nx*data[i]*scale*sign);
        linePts[i-1].x = xShared + (nx*data[i-1]*scale*sign);
      }
    }

    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.shadowColor = color; ctx.shadowBlur = 6; ctx.globalAlpha = 0.15;
    // 填充：图线 + 基准线（沿梁轴）闭合
    ctx.beginPath();
    ctx.moveTo(linePts[0].x, linePts[0].y);
    for(let i=1;i<n;i++) ctx.lineTo(linePts[i].x, linePts[i].y);
    for(let i=n-1;i>=0;i--) ctx.lineTo(basePts[i].x, basePts[i].y);
    ctx.closePath(); ctx.fill();

    // 描边：仅画图线（不画基准线），并对突变对画醒目的竖直线
    ctx.globalAlpha = 1; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(linePts[0].x, linePts[0].y);
    for(let i=1;i<n;i++){
      // 突变对：用更粗的线画竖线
      if(Math.abs(xArr[i] - xArr[i-1]) < 1e-4 && Math.abs(data[i] - data[i-1]) > 0.3){
        ctx.stroke();  // 先完成之前的路径
        ctx.save();
        ctx.lineWidth = 3.2; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(linePts[i-1].x, linePts[i-1].y);
        ctx.lineTo(linePts[i].x, linePts[i].y);
        ctx.stroke();
        ctx.restore();
        // 重启主路径
        ctx.beginPath();
        ctx.moveTo(linePts[i].x, linePts[i].y);
      } else {
        ctx.lineTo(linePts[i].x, linePts[i].y);
      }
    }
    ctx.stroke();

    // ★ 使用 computeInternalForcesBySuperposition 预计算的控制截面索引 ctrlIdx
    //   仅这些索引输出标签；中间采样点只绘图不输出文字
    const keyIdx = new Set(f.ctrlIdx || []);
    ctx.shadowBlur = 0; ctx.font = 'bold 10px "Consolas",monospace'; ctx.textAlign = 'center';
    // —— 突变点标签防重叠：对于力偶/集中力造成的相邻两点跳跃，错开标注位置 ——
    //   严格判定"突变对"：必须同时满足 (a) 索引相邻 (b) x 坐标几乎相同 (c) 数值差异显著
    //   这样才能精准识别 x⁻/x⁺ 对，而不会误判 UDL 段抛物线上的相邻采样点
    const idxArr = [...keyIdx].sort((a,b)=>a-b);
    const isJumpPair = new Set();  // 记录哪些索引属于突变对（需要偏移标签）
    if(type === 'M' || type === 'V' || type === 'N') {
      for(let k=1; k<idxArr.length; k++) {
        const i1 = idxArr[k-1], i2 = idxArr[k];
        if(i2 - i1 <= 2 && i2 - i1 >= 1) {
          const dx = Math.abs(xArr[i2] - xArr[i1]);   // x 坐标差
          const dM = Math.abs(data[i2] - data[i1]);    // 弯矩差
          // 力偶突变对：x 几乎相同（< 1e-4）但 M 差异大（> 0.5）
          if(dx < 1e-4 && dM > 0.5) {
            isJumpPair.add(i1); isJumpPair.add(i2);
          }
        }
      }
    }
    idxArr.forEach((i, kInArr) => {
      if(i<0 || i>=n) return;
      const val = data[i];
      if(Math.abs(val) < 0.1) return;
      // ★ 使用实际 x 坐标（与图线一致），而非均匀索引
      const t = xArr[i] / L_mem;
      const bx = sa.x+(sb.x-sa.x)*t, by=sa.y+(sb.y-sa.y)*t;
      const v = val*scale*sign;
      const px = bx+nx*v, py = by+ny*v;
      const offDir = v >= 0 ? 1 : -1;
      // 突变点：左点标注额外向"左上方"偏移，右点向"右下方"偏移（避免重叠）
      let lx, ly;
      if(isJumpPair.has(i)) {
        // 判断这是突变对中的"左点"还是"右点"
        const pos = idxArr.indexOf(i);
        // 基础偏移（沿法向）
        const base_off = 16;
        lx = px + nx*base_off*offDir;
        ly = py + ny*base_off*offDir;
        // 水平方向再额外错开：左右两点分别 ±12px
        const extraX = (pos > 0 && isJumpPair.has(idxArr[pos-1])) ? 14 :
                       (pos < idxArr.length-1 && isJumpPair.has(idxArr[pos+1])) ? -14 : 0;
        lx += extraX;
        // 竖直方向同步错开（沿法向±5px）
        ly += ny*5*offDir * (extraX > 0 ? 1 : (extraX<0?-1:0));
      } else {
        lx = px + nx*14*offDir;
        ly = py + ny*14*offDir;
      }
      // 弯矩图：取绝对值+标注"左/右"（若为力偶突变点）；剪力/轴力保留带符号
      let txt;
      if(type === 'M') {
        txt = Math.abs(val).toFixed(1);
        // 如果是突变点，加上"左"或"右"角标
        if(isJumpPair.has(i)) {
          const pos = idxArr.indexOf(i);
          const tag = (pos < idxArr.length-1 && isJumpPair.has(idxArr[pos+1])) ? '左' :
                      (pos > 0 && isJumpPair.has(idxArr[pos-1])) ? '右' : '';
          if(tag) txt = `${tag} ${txt}`;
        }
      } else {
        // 剪力图/轴力图：带符号；若为突变点（集中力处），也加"左/右"角标
        txt = (val>=0?'+':'') + val.toFixed(1);
        if(isJumpPair.has(i)) {
          const pos = idxArr.indexOf(i);
          const tag = (pos < idxArr.length-1 && isJumpPair.has(idxArr[pos+1])) ? '左' :
                      (pos > 0 && isJumpPair.has(idxArr[pos-1])) ? '右' : '';
          if(tag) txt = `${tag} ${txt}`;
        }
      }
      const tw = ctx.measureText(txt).width;
      // 带圆角的底色框
      ctx.fillStyle = 'rgba(13,17,23,0.92)';
      roundRect(ctx, lx-tw/2-4, ly-8, tw+8, 15, 2.5);
      ctx.fill();
      // 弯矩突变点：再画一条细引线（从标签指向图线上的点）
      if(isJumpPair.has(i)) {
        ctx.strokeStyle = color; ctx.globalAlpha = 0.55; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(px, py); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = color;
      ctx.fillText(txt, lx, ly+3);
    });

    // ★★★ 叠加法基线（虚线）：由控制点弯矩连线，贯穿全梁 ★★★
    //   相邻控制点之间画虚线直线（无荷载段直线，UDL段基线也是直线）
    //   真实弯矩 = 基线 + 抛物线（仅 UDL 段叠加）
    if(type === 'M' && idxArr.length >= 2) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(linePts[idxArr[0]].x, linePts[idxArr[0]].y);
      for(let k=1; k<idxArr.length; k++) {
        const i = idxArr[k];
        const iPrev = idxArr[k-1];
        // 跳过突变对（x 几乎相同的相邻点，避免画零长度线段）
        if(Math.abs(xArr[i] - xArr[iPrev]) < 1e-4) continue;
        ctx.lineTo(linePts[i].x, linePts[i].y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // ★ UDL 段跨中差值标注 = q·l²/8（仅画差值连接线和标注，不重复标签）
      loads.filter(l=>l.member===mem.id && l.type==='udl').forEach(ld => {
        const w = ld.value;
        const a1 = ld.pos1, a2 = ld.pos2;
        const Lseg = a2 - a1;
        if(Lseg < 1e-9) return;

        const gxA_mem = na.x;
        const M1 = sectionMethodAt(solution.reactions, gxA_mem + a1, 'left').M;
        const M2 = sectionMethodAt(solution.reactions, gxA_mem + a2, 'left').M;

        // 跨中：基线中点 vs 真实弯矩中点
        const tMid = (a1 + a2) / 2 / L_mem;
        const bxMid = sa.x + (sb.x-sa.x)*tMid, byMid = sa.y + (sb.y-sa.y)*tMid;
        const M_base_mid = (M1 + M2) / 2;
        const v_base_mid = M_base_mid * scale * sign;
        const pxBaseMid = bxMid + nx*v_base_mid, pyBaseMid = byMid + ny*v_base_mid;
        const M_parabola_mid = w * Lseg * Lseg / 8;  // t=0.5: w·L²·0.25/2 = w·L²/8
        const M_real_mid = M_base_mid + M_parabola_mid;
        const v_real_mid = M_real_mid * scale * sign;
        const pxRealMid = bxMid + nx*v_real_mid, pyRealMid = byMid + ny*v_real_mid;

        const offDir = v_real_mid >= 0 ? 1 : -1;

        ctx.save();
        // 连接线（基线中点 → 真实弯矩中点）
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(pxBaseMid, pyBaseMid);
        ctx.lineTo(pxRealMid, pyRealMid);
        ctx.stroke();

        // 小圆点（基线中点 + 真实弯矩中点）
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(pxBaseMid, 1.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(pxRealMid, 2, 0, Math.PI*2); ctx.fill();

        // 差值标注框：q·L²/8
        const diffValue = Math.abs(M_parabola_mid);
        const diffTxt = `Δ = q·l²/8 = ${diffValue.toFixed(2)} kN·m`;
        ctx.font = 'bold 10px "Consolas",monospace'; ctx.textAlign = 'center';
        const tw = ctx.measureText(diffTxt).width;
        const midX = (pxBaseMid + pxRealMid) / 2;
        const midY = (pyBaseMid + pyRealMid) / 2;
        const labelOffset = 28 * offDir;
        const lx_diff = midX + nx * labelOffset;
        const ly_diff = midY + ny * labelOffset;
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(13,17,23,0.92)';
        roundRect(ctx, lx_diff - tw/2 - 6, ly_diff - 9, tw + 12, 15, 3);
        ctx.fill();
        ctx.fillStyle = '#ffd700'; // 差值用金黄色高亮
        ctx.fillText(diffTxt, lx_diff, ly_diff + 3);
        ctx.restore();
      });
    }
    ctx.restore();
  });
}

function drawReactionsCheck() {
  if(!showCheck || !solved) return;
  const mf = solution.memberForces;
  // 铰节点校核圆圈
  for(const nodeId in hingeNodes) {
    if(!hingeNodes[nodeId]) continue;
    const node = NODES[nodeId];
    const s = toS(node.x, 0);
    const hingedMembers = MEMBERS.filter(m => m.nodeA === nodeId || m.nodeB === nodeId);
    const maxAbs = Math.max(...hingedMembers.map(m => {
      const val = m.nodeA === nodeId ? mf[m.id].start.M : mf[m.id].end.M;
      return Math.abs(val);
    }));
    const hOk = maxAbs < 0.05;
    const color = hOk ? '#3fb950' : '#f85149';
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(s.x, s.y-60, 10, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    if(hOk){
      ctx.beginPath();
      ctx.moveTo(s.x-3, s.y-60); ctx.lineTo(s.x, s.y-57); ctx.lineTo(s.x+4, s.y-63); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(s.x-3, s.y-63); ctx.lineTo(s.x+3, s.y-57);
      ctx.moveTo(s.x+3, s.y-63); ctx.lineTo(s.x-3, s.y-57); ctx.stroke();
    }
    ctx.font = 'bold 10px "Consolas",monospace'; ctx.fillStyle = color; ctx.textAlign = 'center';
    ctx.fillText(`${nodeId}铰 M≈0`, s.x, s.y-78);
    ctx.restore();
  }
}

function render() {
  if(NODE_IDS.length === 0) { ctx.clearRect(0,0,W,H); return; }
  ctx.clearRect(0, 0, W, H);
  drawStructure();
  // 支座
  NODE_IDS.forEach(id => {
    const type = SUPPORT_TYPES[id]; if(!type || type==='none') return;
    drawSupport(NODES[id].x, type);
  });
  drawLoads();
  if(showM) drawDiagram('M', '#ffd700');
  if(showV) drawDiagram('V', '#58a6ff');
  if(showN) drawDiagram('N', '#3fb950');
  drawReactionsCheck();
}

// ==================== UI面板交互 ====================
let currentTab = 'structure';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['structure','load','result'].forEach(tn => {
    const el = document.getElementById('tab-'+tn);
    if(el) el.style.display = (tn === name) ? '' : 'none';
  });
  if(name === 'result' && solved) { updateCheckResults(); updateMemberResults(); }
}

function renderPanel() {
  // 梁段长度
  const ml = document.getElementById('member-lengths');
  if(!ml) return;
  ml.innerHTML = '';
  MEMBERS.forEach((mem, i) => {
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <label>${mem.nodeA}→${mem.nodeB}</label>
      <input type="number" step="0.1" min="0.1" value="${mem.L.toFixed(1)}" data-idx="${i}">
      ${MEMBERS.length > 1 ? `<button class="del-btn" data-idx="${i}">×</button>` : ''}
    `;
    ml.appendChild(row);
  });
  ml.querySelectorAll('input').forEach(inp => {
    inp.onchange = (e) => {
      const i = +e.target.dataset.idx;
      const newL = parseFloat(e.target.value);
      if(newL > 0) {
        // 暂存到 pendingLengths，不立即重建结构（避免破坏支座/铰设置）
        pendingLengths[i] = newL;
        updateStatus(`${MEMBERS[i].id} 段长度已暂存为 ${newL}m · 点击「应用结构设置」生效`);
      }
    };
  });

  // 支座设置
  const sa = document.getElementById('supports-area');
  sa.innerHTML = '';
  NODE_IDS.forEach(id => {
    const row = document.createElement('div');
    row.className = 'support-row';
    row.innerHTML = `
      <span class="node-label">${id}</span>
      <select data-node="${id}">
        <option value="none">无</option>
        <option value="fixed">固定支座</option>
        <option value="pinned">固定铰支座</option>
        <option value="roller">可动铰支座</option>
        <option value="slider">定向滑动支座</option>
      </select>
    `;
    const sel = row.querySelector('select');
    sel.value = SUPPORT_TYPES[id] || 'none';
    sel.onchange = (e) => {
      updateStatus(`${id} 支座类型已暂存为 ${e.target.options[e.target.selectedIndex].text} · 点击「应用结构设置」生效`);
    };
    sa.appendChild(row);
  });

  // 铰节点设置
  const ha = document.getElementById('hinges-area');
  ha.innerHTML = `<div style="font-size:10.5px;color:#6e7681;margin-bottom:6px;">内部节点设置为铰（弯矩为0）</div>`;
  NODE_IDS.forEach((id, idx) => {
    if(idx === 0 || idx === NODE_IDS.length-1) return; // 跳过端点（外部节点）
    const row = document.createElement('div');
    row.className = 'support-row';
    const checked = hingeNodes[id] ? 'checked' : '';
    row.innerHTML = `
      <span class="node-label" style="color:#a371f7;">${id}</span>
      <label style="font-size:11px;color:#8b949e;display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" data-node="${id}" ${checked} style="accent-color:#a371f7;">
        设为铰节点
      </label>
    `;
    const cb = row.querySelector('input');
    cb.onchange = () => {
      hingeNodes[id] = cb.checked;
      render();
      updateStatus(`${id} ${cb.checked?'已设为铰节点':'恢复为刚接'} · 点击「应用结构设置」生效`);
    };
    ha.appendChild(row);
  });

  updateLoadsList();
}

// 暂存的梁段长度 (用户输入后未应用的结构修改)
let pendingLengths = [];

function addMember() {
  // 立即添加一段（保留所有设置）
  const lengths = pendingLengths.length ? pendingLengths.slice() : MEMBERS.map(m => m.L);
  lengths.push(2);
  buildFromLengths(lengths, {preserve:true});
  pendingLengths = lengths.slice();
  renderPanel(); render();
  updateStatus('已添加新梁段 · 点击「应用结构设置」生效');
}

function removeLastMember() {
  if(MEMBERS.length <= 1) { updateStatus('至少需要保留1个梁段'); return; }
  const lengths = pendingLengths.length ? pendingLengths.slice() : MEMBERS.map(m => m.L);
  lengths.pop();
  buildFromLengths(lengths, {preserve:true});
  pendingLengths = lengths.slice();
  renderPanel(); render();
  updateStatus('已删除末段 · 点击「应用结构设置」生效');
}

function applyStructure() {
  // 1. 读取梁段长度输入框的值
  const inputs = document.querySelectorAll('#member-lengths input');
  const lengths = [];
  inputs.forEach(inp => {
    const v = parseFloat(inp.value);
    lengths.push(v > 0 ? v : 1);
  });
  // 2. 读取支座下拉框的值
  document.querySelectorAll('#supports-area select').forEach(sel => {
    const node = sel.dataset.node;
    SUPPORT_TYPES[node] = sel.value;
  });
  // 3. 读取铰节点复选框的值
  document.querySelectorAll('#hinges-area input[type="checkbox"]').forEach(cb => {
    const node = cb.dataset.node;
    if(cb.checked) hingeNodes[node] = true;
    else delete hingeNodes[node];
  });
  // 4. 重建结构（保留支座/铰/荷载）
  buildFromLengths(lengths, {preserve:true});
  pendingLengths = lengths.slice();
  // 5. 修正荷载位置范围（防止超出新梁段长度）
  loads.forEach(ld => {
    const mem = MEMBERS.find(m => m.id === ld.member);
    if(!mem) return;
    if(ld.type === 'point' || ld.type === 'moment') {
      ld.pos = Math.max(0, Math.min(mem.L, ld.pos));
    } else if(ld.type === 'udl') {
      ld.pos1 = Math.max(0, Math.min(mem.L, ld.pos1));
      ld.pos2 = Math.max(0, Math.min(mem.L, ld.pos2));
      if(ld.pos1 >= ld.pos2) { ld.pos1 = 0; ld.pos2 = mem.L; }
    }
  });
  renderPanel(); render();
  updateStatus('结构设置已应用 · 共 ' + MEMBERS.length + ' 段 · 点击「求解结构内力」计算');
}

// 荷载
let loadIdCounter = 1;
function addLoad(type) {
  const defaultMember = MEMBERS[0]?.id;
  if(!defaultMember) { alert('请先创建梁段'); return; }
  const L = MEMBERS[0].L;
  const ld = { id: loadIdCounter++, type, member: defaultMember, value: 10 };
  if(type === 'point') {
    ld.pos = L/2; ld.direction = 'down';
  } else if(type === 'moment') {
    ld.pos = L/2; ld.direction = 'ccw'; ld.value = 20;
  } else if(type === 'udl') {
    ld.pos1 = 0; ld.pos2 = L;
  }
  loads.push(ld);
  updateLoadsList();
  solved = false;
  render();
}
function removeLoad(id) {
  loads = loads.filter(l => l.id !== id);
  updateLoadsList();
  solved = false;
  render();
}
function updateLoadsList() {
  const ls = document.getElementById('loads-list');
  if(!ls) return;
  if(loads.length === 0) {
    ls.innerHTML = '<div style="font-size:11px;color:#484f58;text-align:center;padding:12px 0;">暂无荷载，点击上方按钮添加</div>';
    return;
  }
  ls.innerHTML = '';
  loads.forEach(ld => {
    const mem = MEMBERS.find(m => m.id === ld.member);
    const L = mem?.L || 1;
    const div = document.createElement('div');
    div.className = 'load-item';
    let html = `<div class="load-hdr"><span class="load-type">${loadTypeLabel(ld.type)}</span><button class="del-btn" data-id="${ld.id}">×</button></div>`;
    html += `<label>作用梁段
      <select data-field="member">${MEMBERS.map(m=>`<option value="${m.id}" ${m.id===ld.member?'selected':''}>${m.id}</option>`).join('')}</select>
    </label>`;
    html += `<label>大小 (${ld.type==='udl'?'kN/m':ld.type==='moment'?'kN·m':'kN'})
      <input type="number" step="0.1" value="${ld.value}" data-field="value">
    </label>`;
    if(ld.type === 'point') {
      html += `<label>位置 (0~${L.toFixed(1)}m)
        <input type="number" step="0.1" min="0" max="${L}" value="${ld.pos}" data-field="pos">
      </label>
      <div class="load-row-2">
        <div><label>方向
          <select data-field="direction">
            <option value="down" ${ld.direction==='down'?'selected':''}>↓ 向下</option>
            <option value="up" ${ld.direction==='up'?'selected':''}>↑ 向上</option>
            <option value="right" ${ld.direction==='right'?'selected':''}>→ 向右</option>
            <option value="left" ${ld.direction==='left'?'selected':''}>← 向左</option>
          </select>
        </label></div>
      </div>`;
    } else if(ld.type === 'moment') {
      html += `<label>位置 (0~${L.toFixed(1)}m)
        <input type="number" step="0.1" min="0" max="${L}" value="${ld.pos}" data-field="pos">
      </label>
      <label>方向
        <select data-field="direction">
          <option value="ccw" ${ld.direction==='ccw'?'selected':''}>↺ 逆时针</option>
          <option value="cw" ${ld.direction==='cw'?'selected':''}>↻ 顺时针</option>
        </select>
      </label>`;
    } else if(ld.type === 'udl') {
      html += `<div class="load-row-2">
        <div><label>起点 (m)<input type="number" step="0.1" min="0" max="${L}" value="${ld.pos1}" data-field="pos1"></label></div>
        <div><label>终点 (m)<input type="number" step="0.1" min="0" max="${L}" value="${ld.pos2}" data-field="pos2"></label></div>
      </div>
      <div style="margin-top:4px;font-size:10px;color:#6e7681;">均布荷载默认向下作用</div>`;
    }
    div.innerHTML = html;
    div.querySelector('.del-btn').onclick = () => removeLoad(ld.id);
    div.querySelectorAll('[data-field]').forEach(inp => {
      const f = inp.dataset.field;
      const handler = () => {
        let v = inp.type === 'number' ? parseFloat(inp.value) : inp.value;
        if(isNaN(v)) v = 0;
        ld[f] = v;
        // 修正范围
        const m2 = MEMBERS.find(x=>x.id===ld.member);
        const LL = m2?.L || L;
        if(ld.type === 'point' || ld.type === 'moment') ld.pos = Math.max(0, Math.min(LL, ld.pos || 0));
        if(ld.type === 'udl') {
          ld.pos1 = Math.max(0, Math.min(LL, ld.pos1 || 0));
          ld.pos2 = Math.max(0, Math.min(LL, ld.pos2 || 0));
          if(ld.pos1 >= ld.pos2) { ld.pos1=0; ld.pos2=LL; }
        }
        solved = false;
        updateLoadsList(); render();
      };
      inp.onchange = handler;
      if(inp.tagName === 'SELECT') inp.onchange = handler;
    });
    ls.appendChild(div);
  });
}

function loadTypeLabel(t) {
  return t === 'point' ? '集中力' : t === 'moment' ? '集中力偶' : '均布荷载';
}
